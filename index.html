<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Asistencia Casino</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<script>try{var t=localStorage.getItem('casino_tema');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<div class="wrap">
  <div id="demo" class="demo" hidden><b>Modo demostración.</b> Prueba con el código <b>K7P2QX</b>. Los datos quedan solo en este dispositivo.</div>

  <header>
    <div class="marca">
      <img class="logo claro" src="logo.png" alt="Skretting" width="480" height="190">
      <img class="logo oscuro" src="logo-oscuro.png" alt="Skretting" width="480" height="190">
      <div class="marca-acciones">
        <button class="tema" id="btnTema" type="button" aria-label="Cambiar entre modo claro y oscuro" title="Modo claro / oscuro"><svg class="ico-luna" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z"/></svg><svg class="ico-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg></button>
        <button class="refrescar" id="btnRefrescar" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>Actualizar</button>
      </div>
    </div>
    <span class="eyebrow">Casino · Almuerzo</span>
    <h1 class="fecha" id="fecha">Hoy</h1>
    <span class="corte" id="corte"><span class="dot"></span><span id="corteTxt">Corte</span></span>
  </header>

  <!-- Primera vez: código -->
  <section class="ticket vale" id="vCodigo" hidden>
    <h2 class="hola">Escribe tu código</h2>
    <p class="msg">Está en el mensaje que te envió la secretaria. Solo se pide la primera vez.</p>
    <form id="formCodigo" class="campo" style="gap:14px">
      <div class="campo">
        <label for="txtCodigo">Código</label>
        <input type="text" id="txtCodigo" class="codigo" maxlength="12" autocomplete="one-time-code" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="Ej: K7P2QX">
      </div>
      <button class="btn" type="submit" id="btnEntrar">Entrar</button>
      <p class="msg" id="msgCodigo" aria-live="polite"></p>
    </form>
  </section>

  <!-- Anotarse -->
  <section class="ticket vale" id="vAnotar" hidden>
    <div class="hola" id="hola">Hola</div>
    <div id="formAnotar">
      <div class="opciones" role="radiogroup" aria-label="Tipo de almuerzo">
        <div class="opcion"><input type="radio" name="tipo" id="tNormal" value="Normal" checked><label for="tNormal"><b>Normal</b><span>Menú del día</span></label></div>
        <div class="opcion"><input type="radio" name="tipo" id="tHipo" value="Hipocalórico"><label for="tHipo"><b>Hipocalórico</b><span>Opción liviana</span></label></div>
      </div>
      <button class="btn" id="btnAnotar" style="margin-top:14px">Voy a almorzar</button>
    </div>
    <div id="anotado" hidden>
      <div class="estado" id="estadoBox">
        <span class="eyebrow">Anotado</span>
        <span class="big" id="estadoTipo">Normal</span>
        <span id="estadoHora" class="msg" style="color:inherit"></span>
      </div>
      <div class="fila" style="margin-top:12px">
        <button class="btn sec" id="btnCambiar">Cambiar opción</button>
        <button class="btn sec" id="btnCancelar">No voy a almorzar</button>
      </div>
    </div>
    <p id="cerrado" class="msg" hidden>Hoy no hay servicio de casino.</p>
    <p class="msg" id="msg" aria-live="polite"></p>
  </section>

  <footer>
    <button class="link" id="btnPersona" hidden>No soy yo</button>
  </footer>
</div>

<script src="comun.js" charset="utf-8"></script>
<script>
let codigo = store.get('casino_codigo');
store.del('casino_nombre');                        // dato de la versión anterior

function pintarFecha(){
  $('fecha').textContent = fechaLarga(ahoraStgo().fecha, false);
  const t=ahoraStgo(), c=$('corte');
  c.classList.remove('tarde','cerrado');
  if(t.finde){ c.classList.add('cerrado'); $('corteTxt').textContent='Fin de semana'; return }
  const resto=minCorte()-t.min;
  if(resto>0){ const h=Math.floor(resto/60), m=resto%60; $('corteTxt').textContent=`Corte ${corteActual} · faltan ${h?h+' h ':''}${m} min` }
  else { c.classList.add('tarde'); $('corteTxt').textContent=`Pasó el corte de las ${corteActual} · se avisa como tarde` }
}
function msg(t,err){ $('msg').textContent=t||''; $('msg').classList.toggle('err',!!err) }
function msgCodigo(t,err){ $('msgCodigo').textContent=t||''; $('msgCodigo').classList.toggle('err',!!err) }
const primerNombre = n => n.replace(/^Ejemplo: /,'').split(' ')[0];

/* ---------- Código ---------- */
function mostrarCodigo(aviso){
  codigo=null; store.del('casino_codigo'); store.del('casino_saludo');
  $('vCodigo').hidden=false; $('vAnotar').hidden=true; $('btnPersona').hidden=true;
  msgCodigo(aviso||'', !!aviso);
}
async function entrar(c){
  c=normCodigo(c);
  if(c.length<4){ msgCodigo('Revisa el código: son 6 letras y números.',true); return }
  $('btnEntrar').disabled=true; msgCodigo('Revisando…');
  try{
    const r=await api('entrar',{codigo:c}); fijarCorte(r.corte); pintarFecha();
    codigo=c; store.set('casino_codigo',c); store.set('casino_saludo',r.nombre);
    $('txtCodigo').value=''; mostrarAnotar(r.nombre);
  }catch(e){ mostrarCodigo(e.message) }
  $('btnEntrar').disabled=false;
}
$('formCodigo').onsubmit=e=>{ e.preventDefault(); entrar($('txtCodigo').value) };
$('btnPersona').onclick=()=>mostrarCodigo();

/* ---------- Anotarse ---------- */
function siCodigoInvalido(e){
  if(e.codigo){ mostrarCodigo('Tu código cambió o ya no es válido. Escribe el nuevo que te envió la secretaria.'); return true }
  return false;
}
function pintarEstado(ins){
  const t=ahoraStgo();
  $('cerrado').hidden=!t.finde || !!ins;
  $('formAnotar').hidden=!!ins || t.finde;
  $('anotado').hidden=!ins;
  if(!ins){ $('btnAnotar').textContent='Voy a almorzar'; return }
  $('estadoTipo').textContent=ins.tipo;
  $('estadoBox').classList.toggle('tarde',!!ins.tarde);
  $('estadoHora').textContent = ins.origen==='Secretaria' ? 'La secretaria te dejó anotado.'
    : ins.tarde ? `Avisaste a las ${ins.hora}, después del corte. La cocina lo verá aparte.`
    : `Avisaste a las ${ins.hora}. Estás en la lista de la cocina.`;
  (ins.tipo==='Hipocalórico'?$('tHipo'):$('tNormal')).checked=true;
}
async function mostrarAnotar(nombre){
  $('vCodigo').hidden=true; $('vAnotar').hidden=false; $('btnPersona').hidden=false;
  if(nombre) $('hola').textContent=`Hola, ${primerNombre(nombre)}`;
  msg('Revisando…');
  try{
    const r=await api('estado',{codigo}); fijarCorte(r.corte); pintarFecha();
    store.set('casino_saludo',r.nombre); $('hola').textContent=`Hola, ${primerNombre(r.nombre)}`;
    pintarEstado(r.inscripcion); msg('');
  }catch(e){ if(!siCodigoInvalido(e)){ pintarEstado(null); msg(e.message,true) } }
}
$('btnAnotar').onclick=async()=>{
  const tipo=document.querySelector('input[name=tipo]:checked').value;
  $('btnAnotar').disabled=true; msg('Guardando…');
  try{ const {inscripcion,corte}=await api('anotar',{codigo,tipo}); fijarCorte(corte); pintarFecha(); $('btnAnotar').textContent='Voy a almorzar'; pintarEstado(inscripcion); msg('') }
  catch(e){ if(!siCodigoInvalido(e)) msg(e.message,true) }
  $('btnAnotar').disabled=false;
};
$('btnCambiar').onclick=()=>{ $('anotado').hidden=true; $('formAnotar').hidden=false; $('btnAnotar').textContent='Guardar cambio'; msg('') };
$('btnCancelar').onclick=async()=>{
  msg('Quitando…');
  try{ await api('cancelar',{codigo}); pintarEstado(null); msg('Listo, no estás en la lista de hoy.') }
  catch(e){ if(!siCodigoInvalido(e)) msg(e.message,true) }
};

/* ---------- Inicio ---------- */
$('demo').hidden=!DEMO;
pintarFecha();

/* ---------- Actualizar ----------
   Si la pestaña quedó abierta desde ayer, al volver a mirarla o al cambiar el día
   se recarga sola. El botón hace lo mismo a pedido.                               */
let diaMostrado=ahoraStgo().fecha, ultimaCarga=Date.now();
async function refrescar(){
  pintarFecha(); diaMostrado=ahoraStgo().fecha; ultimaCarga=Date.now();
  if(codigo) await mostrarAnotar(store.get('casino_saludo'));
}
$('btnRefrescar').onclick=async()=>{
  const b=$('btnRefrescar'); b.disabled=true; b.classList.add('girando');
  await refrescar();
  b.disabled=false; b.classList.remove('girando');
  if(codigo && !$('msg').classList.contains('err')) msg(`Actualizado a las ${ahoraStgo().hora}.`);
};
setInterval(()=>{ pintarFecha(); if(ahoraStgo().fecha!==diaMostrado) refrescar() },30000);
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible' && (ahoraStgo().fecha!==diaMostrado || Date.now()-ultimaCarga>60000)) refrescar();
});
window.addEventListener('pageshow',e=>{ if(e.persisted) refrescar() });   // volver con "atrás" en el teléfono

// El link del mensaje trae el código (…/?c=K7P2QX): se usa y se borra de la barra de direcciones
const deLink = new URLSearchParams(location.search).get('c');
if(deLink){
  try{ history.replaceState(null,'',location.pathname) }catch(e){}
  $('vCodigo').hidden=false; entrar(deLink);
} else if(codigo){
  mostrarAnotar(store.get('casino_saludo'));
} else {
  mostrarCodigo();
}
</script>
</body>
</html>
